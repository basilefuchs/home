theme = "onedark"

[editor]
mouse = true
line-number = "relative"
bufferline = "multiple"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[keys.normal]
C-s = ":write"
C-z = "undo"
C-y = "redo"
C-d = ["select_mode", "search_selection", "extend_search_next"]

[keys.select]
C-d = "extend_search_next"

[keys.insert]
C-s = ":write"
